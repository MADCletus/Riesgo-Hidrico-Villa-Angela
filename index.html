<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Mapa de Riesgo Hídrico - Villa Ángela</title>
  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #111;
      color: #fff;
    }

    h1 {
      margin: 10px;
      font-size: 20px;
    }

    #panel {
      margin: 0 10px 10px 10px;
      padding: 10px;
      background: rgba(0, 0, 0, 0.9);
      border-radius: 4px;
    }

    #panel label {
      font-size: 12px;
      margin-right: 4px;
    }

    #panel select {
      padding: 2px 4px;
      margin-right: 6px;
      margin-bottom: 4px;
      font-size: 12px;
      background: #ffffff;
      color: #000000;   /* <-- acá estaba el problema */
      border-radius: 2px;
    }

    #panel button {
      padding: 4px 10px;
      font-size: 12px;
      cursor: pointer;
    }

    #direccion {
      padding: 2px 4px;
      font-size: 12px;
      width: 280px;
      background: #ffffff;
      color: #000000;
      border-radius: 2px;
      margin-left: 4px;
    }

    #map {
      width: 100%;
      height: calc(100vh - 210px);
    }

    #info-panel {
      margin: 0 10px 10px 10px;
      padding: 10px;
      background: rgba(0, 0, 0, 0.9);
      border-radius: 4px;
      font-size: 13px;
      min-height: 40px;
    }

    #info-panel ul {
      margin: 4px 0 0 16px;
      padding: 0;
    }
  </style>

  <!-- Google Maps JS API (reemplazar YOUR_API_KEY) + Places -->
  <script src="https://maps.googleapis.com/maps/api/js?key=AIzaSyDxaqdAkj5OZSbiim2oxydQAXsxfDOvl7k&libraries=places"></script>

  <!-- Turf.js para intersecciones y áreas -->
  <script src="https://unpkg.com/@turf/turf@6.5.0/turf.min.js"></script>

  <script>
    let map;
    let catastroLayer;

    function initMap() {
      map = new google.maps.Map(document.getElementById("map"), {
        zoom: 12,
        center: { lat: -27.569591091468123, lng: -60.709673623075524 },
        mapTypeId: "satellite",
      });

      // 1) CATASTRO
      catastroLayer = new google.maps.Data();
      catastroLayer.loadGeoJson(
        "https://madcletus.github.io/Riesgo-Hidrico-Villa-Angela/Catastro.json",
        null,
        function () {
          console.log("Catastro cargado");
          poblarDesplegablesDesdeCatastro();
        }
      );

      catastroLayer.setStyle(function () {
        return {
          fillColor: "transparent",
          fillOpacity: 0,
          strokeColor: "#ffffff",
          strokeWeight: 1,
        };
      });
      catastroLayer.setMap(map);

      // 2) ZONIFICACIÓN
      map.data.loadGeoJson(
        "https://madcletus.github.io/Riesgo-Hidrico-Villa-Angela/Zonificacion.json",
        null,
        function () {
          console.log("Zonificación cargada");
        }
      );

      // 3) CANALES
      map.data.loadGeoJson(
        "https://madcletus.github.io/Riesgo-Hidrico-Villa-Angela/Canales.json",
        null,
        function () {
          console.log("Canales cargados");
        }
      );

      // Estilo ZONAS + CANALES
      map.data.setStyle(function (feature) {
        const amenaza = feature.getProperty("AMENAZA");
        const canalId = feature.getProperty("Id");

        let fillColor = "transparent";
        let strokeColor = "transparent";
        let strokeWeight = 1;
        let fillOpacity = 0.0;

        if (amenaza) {
          if (amenaza === "SEVERA") fillColor = "red";
          else if (amenaza === "ALTA") fillColor = "yellow";
          else if (amenaza === "MODERADA") fillColor = "green";
          else if (amenaza === "LEVE") fillColor = "transparent";

          strokeColor = fillColor === "transparent" ? "#aaaaaa" : fillColor;
          strokeWeight = 1;
          fillOpacity = fillColor === "transparent" ? 0.0 : 0.4;
        }

        if (canalId !== null && canalId !== undefined) {
          strokeColor = "red";
          strokeWeight = 3;
          fillOpacity = 0.0;
        }

        return { fillColor, fillOpacity, strokeColor, strokeWeight };
      });

      // Formulario de búsqueda por catastro
      document
        .getElementById("search-form")
        .addEventListener("submit", function (e) {
          e.preventDefault();

          const filtro = {
            Chacra: document.getElementById("chacraSelect").value,
            frac: document.getElementById("fraccionSelect").value,
            Sub_Ch: document.getElementById("subChSelect").value,
            Mza: document.getElementById("manzanaSelect").value,
            Parce: document.getElementById("parcelaSelect").value,
            Quinta: document.getElementById("quintaSelect").value,
          };

          buscarParcela(filtro);
        });

      // Buscador por direcciones
const inputDir = document.getElementById("direccion");

const autocomplete = new google.maps.places.Autocomplete(inputDir, {
  componentRestrictions: { country: "ar" },  // limitar a Argentina (opcional)
  fields: ["geometry", "formatted_address", "name"]  // 👈 PEDIMOS GEOMETRY
});

autocomplete.bindTo("bounds", map);

autocomplete.addListener("place_changed", function () {
  const place = autocomplete.getPlace();
  console.log("Place devuelto por Autocomplete:", place);

  if (!place.geometry || !place.geometry.location) {
    alert("No se encontró la dirección (el lugar no tiene geometría).");
    return;
  }

  if (place.geometry.viewport) {
    map.fitBounds(place.geometry.viewport);
  } else {
    map.setCenter(place.geometry.location);
    map.setZoom(18);
  }
});

    // Poblar combos desde catastro
    function poblarDesplegablesDesdeCatastro() {
      const sets = {
        Chacra: new Set(),
        frac: new Set(),
        Sub_Ch: new Set(),
        Mza: new Set(),
        Parce: new Set(),
        Quinta: new Set(),
      };

      catastroLayer.forEach(function (feature) {
        Object.keys(sets).forEach(function (key) {
          const val = feature.getProperty(key);
          if (val !== null && val !== undefined && val !== "") {
            sets[key].add(val.toString());
          }
        });
      });

      llenarSelect("chacraSelect", sets.Chacra);
      llenarSelect("fraccionSelect", sets.frac);
      llenarSelect("subChSelect", sets.Sub_Ch);
      llenarSelect("manzanaSelect", sets.Mza);
      llenarSelect("parcelaSelect", sets.Parce);
      llenarSelect("quintaSelect", sets.Quinta);
    }

    function llenarSelect(selectId, valueSet) {
      const sel = document.getElementById(selectId);
      sel.innerHTML = '<option value="">Todas</option>';
      Array.from(valueSet)
        .sort()
        .forEach(function (val) {
          const opt = document.createElement("option");
          opt.value = val;
          opt.textContent = val;
          sel.appendChild(opt);
        });
    }

    // Buscar y resaltar parcelas
    function buscarParcela(filtro) {
      let bounds = new google.maps.LatLngBounds();
      let hayMatch = false;
      let seleccionadas = [];

      catastroLayer.setStyle(function (feature) {
        const fChacra = (feature.getProperty("Chacra") || "").toString().trim();
        const fFrac = (feature.getProperty("frac") || "").toString().trim();
        const fSubCh = (feature.getProperty("Sub_Ch") || "").toString().trim();
        const fMza = (feature.getProperty("Mza") || "").toString().trim();
        const fParce = (feature.getProperty("Parce") || "").toString().trim();
        const fQuinta = (feature.getProperty("Quinta") || "").toString().trim();

        const coincide =
          (filtro.Chacra === "" || filtro.Chacra === fChacra) &&
          (filtro.frac === "" || filtro.frac === fFrac) &&
          (filtro.Sub_Ch === "" || filtro.Sub_Ch === fSubCh) &&
          (filtro.Mza === "" || filtro.Mza === fMza) &&
          (filtro.Parce === "" || filtro.Parce === fParce) &&
          (filtro.Quinta === "" || filtro.Quinta === fQuinta);

        if (coincide) {
          hayMatch = true;
          seleccionadas.push(feature);
          expandBoundsFromGeometry(feature.getGeometry(), bounds);
          return {
            fillColor: "#00ffff",
            fillOpacity: 0.4,
            strokeColor: "#00ffff",
            strokeWeight: 3,
          };
        } else {
          return {
            fillColor: "transparent",
            fillOpacity: 0,
            strokeColor: "#ffffff",
            strokeWeight: 1,
          };
        }
      });

      if (hayMatch) {
        map.fitBounds(bounds);

        const propsFirst = seleccionadas[0]
          ? {
              Chacra: seleccionadas[0].getProperty("Chacra"),
              frac: seleccionadas[0].getProperty("frac"),
              Sub_Ch: seleccionadas[0].getProperty("Sub_Ch"),
              Mza: seleccionadas[0].getProperty("Mza"),
              Parce: seleccionadas[0].getProperty("Parce"),
              Quinta: seleccionadas[0].getProperty("Quinta"),
            }
          : {};

        actualizarPanelInfo(
          { totalArea: 0, porcentajes: { SEVERA: 0, ALTA: 0, MODERADA: 0, LEVE: 0 } },
          propsFirst
        );

        calcularPorcentajeRiesgo(seleccionadas);
      } else {
        document.getElementById("info-panel").innerHTML =
          "<strong>No se encontró ninguna parcela con esos datos.</strong>";
        alert("No se encontró ninguna parcela con esos datos.");
      }
    }

    function expandBoundsFromGeometry(geometry, bounds) {
      const type = geometry.getType();
      if (type === "Point") {
        bounds.extend(geometry.get());
      } else if (
        type === "MultiPoint" ||
        type === "LineString" ||
        type === "LinearRing"
      ) {
        geometry.getArray().forEach((latLng) => bounds.extend(latLng));
      } else if (
        type === "MultiLineString" ||
        type === "Polygon" ||
        type === "MultiPolygon"
      ) {
        geometry.getArray().forEach((g) => expandBoundsFromGeometry(g, bounds));
      } else if (type === "GeometryCollection") {
        geometry.getArray().forEach((g) => expandBoundsFromGeometry(g, bounds));
      }
    }

    // Cálculo de riesgo con Turf
    function calcularPorcentajeRiesgo(featuresParcela) {
      if (!featuresParcela.length || typeof turf === "undefined") {
        console.warn("No hay parcelas o Turf no está disponible.");
        return;
      }

      const parcelasGeoJSON = { type: "FeatureCollection", features: [] };
      let pendientesParc = featuresParcela.length;

      featuresParcela.forEach((f) => {
        f.toGeoJson(function (gj) {
          parcelasGeoJSON.features.push(gj);
          pendientesParc--;
          if (pendientesParc === 0) {
            map.data.toGeoJson(function (coleccion) {
              const zonas = coleccion.features.filter(
                (z) => z.properties && z.properties.AMENAZA
              );
              const resultado = calcularAreasRiesgo(parcelasGeoJSON, zonas);
              const props = parcelasGeoJSON.features[0].properties || {};
              actualizarPanelInfo(resultado, props);
            });
          }
        });
      });
    }

    function calcularAreasRiesgo(parcelas, zonas) {
      let totalAreaParcelas = 0;
      const areaPorRiesgo = { SEVERA: 0, ALTA: 0, MODERADA: 0, LEVE: 0 };

      parcelas.features.forEach((p) => {
        const areaParc = turf.area(p);
        totalAreaParcelas += areaParc;

        zonas.forEach((z) => {
          const inter = turf.intersect(p, z);
          if (inter) {
            const aInt = turf.area(inter);
            const riesgo = z.properties.AMENAZA;
            if (areaPorRiesgo[riesgo] !== undefined) {
              areaPorRiesgo[riesgo] += aInt;
            }
          }
        });
      });

      if (totalAreaParcelas === 0) {
        return {
          totalArea: 0,
          porcentajes: { SEVERA: 0, ALTA: 0, MODERADA: 0, LEVE: 0 },
        };
      }

      const porcentajes = {};
      Object.keys(areaPorRiesgo).forEach((k) => {
        porcentajes[k] = (areaPorRiesgo[k] / totalAreaParcelas) * 100;
      });

      return {
        totalArea: totalAreaParcelas,
        areaPorRiesgo,
        porcentajes,
      };
    }

    function actualizarPanelInfo(resultado, props) {
      const nombreParcela =
        `Chacra ${props.Chacra || "-"}, ` +
        `Frac. ${props.frac || "-"}, ` +
        `Sub_Ch ${props.Sub_Ch || "-"}, ` +
        `Mza ${props.Mza || "-"}, ` +
        `Parcela ${props.Parce || "-"}, ` +
        `Quinta ${props.Quinta || "-"}`;

      const p =
        resultado.porcentajes || {
          SEVERA: 0,
          ALTA: 0,
          MODERADA: 0,
          LEVE: 0,
        };

      const html = `
        <details open>
          <summary><strong>Parcela seleccionada</strong></summary>
          <div style="margin-top:4px;">
            <div><strong>Identificación:</strong> ${nombreParcela}</div>
            <div style="margin-top:6px;"><strong>Porcentaje de riesgo dentro de la parcela:</strong></div>
            ${
              !resultado.totalArea
                ? "<div>(Aún sin cálculo o geometría no válida)</div>"
                : `<ul>
                    <li>Severa: ${p.SEVERA.toFixed(1)}%</li>
                    <li>Alta: ${p.ALTA.toFixed(1)}%</li>
                    <li>Moderada: ${p.MODERADA.toFixed(1)}%</li>
                    <li>Leve: ${p.LEVE.toFixed(1)}%</li>
                  </ul>`
            }
          </div>
        </details>
      `;
      document.getElementById("info-panel").innerHTML = html;
    }
  </script>
</head>
<body onload="initMap()">
  <h1>Mapa de Riesgo Hídrico - Villa Ángela</h1>

  <div id="panel">
    <form id="search-form">
      <label>Chacra</label>
      <select id="chacraSelect">
        <option value="">Todas</option>
      </select>

      <label>Frac.</label>
      <select id="fraccionSelect">
        <option value="">Todas</option>
      </select>

      <label>Sub Ch.</label>
      <select id="subChSelect">
        <option value="">Todas</option>
      </select>

      <label>Mza</label>
      <select id="manzanaSelect">
        <option value="">Todas</option>
      </select>

      <label>Parcela</label>
      <select id="parcelaSelect">
        <option value="">Todas</option>
      </select>

      <label>Quinta</label>
      <select id="quintaSelect">
        <option value="">Todas</option>
      </select>

      <button type="submit">Buscar</button>
    </form>

    <div style="margin-top:8px;">
      <label>Buscar por dirección:</label>
      <input type="text" id="direccion" placeholder="Ej: San Martín 100, Villa Ángela" />
    </div>
  </div>

  <div id="info-panel">
    <!-- acá se muestra el desplegable con la info -->
  </div>

  <div id="map"></div>
</body>
</html>
