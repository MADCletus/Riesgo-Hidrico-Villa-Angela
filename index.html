<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Mapa de Riesgo Hídrico - Villa Ángela</title>
  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #111;
      color: #fff;
    }

    h1 {
      margin: 10px;
      font-size: 20px;
    }

    #panel {
      margin: 0 10px 10px 10px;
      padding: 10px;
      background: rgba(0, 0, 0, 0.7);
      border-radius: 4px;
    }

    #panel label {
      font-size: 12px;
      margin-right: 4px;
    }

    #panel input {
      width: 70px;
      padding: 2px 4px;
      margin-right: 6px;
      margin-bottom: 4px;
      font-size: 12px;
    }

    #panel button {
      padding: 4px 10px;
      font-size: 12px;
      cursor: pointer;
    }

    #map {
      width: 100%;
      height: calc(100vh - 190px);
    }

    #info-panel {
      margin: 0 10px 10px 10px;
      padding: 10px;
      background: rgba(0, 0, 0, 0.7);
      border-radius: 4px;
      font-size: 13px;
    }

    #info-panel ul {
      margin: 4px 0 0 16px;
      padding: 0;
    }
  </style>

  <!-- Google Maps JS API (poné tu API key) -->
  <script src="https://maps.googleapis.com/maps/api/js?key=AIzaSyDxaqdAkj5OZSbiim2oxydQAXsxfDOvl7k&libraries=places"></script>

  <!-- Turf.js para intersecciones y áreas -->
  <script src="https://unpkg.com/@turf/turf@6.5.0/turf.min.js"></script>

  <script>
    let map;
    let catastroLayer; // capa para las parcelas

    function initMap() {
      map = new google.maps.Map(document.getElementById("map"), {
        zoom: 12,
        center: { lat: -27.569591091468123, lng: -60.709673623075524 },
        mapTypeId: "satellite",
      });

      // =======================
      // 1) Cargar CATASTRO
      // =======================
      catastroLayer = new google.maps.Data();
      catastroLayer.loadGeoJson(
        "https://madcletus.github.io/Riesgo-Hidrico-Villa-Angela/Catastro.json",
        null,
        function () {
          console.log("Catastro cargado");
        }
      );

      // Estilo base del catastro (contorno claro, sin relleno)
      catastroLayer.setStyle(function (feature) {
        return {
          fillColor: "transparent",
          fillOpacity: 0,
          strokeColor: "#ffffff",
          strokeWeight: 1,
        };
      });

      catastroLayer.setMap(map);

      // =======================
      // 2) Cargar ZONIFICACIÓN
      // =======================
      map.data.loadGeoJson(
        "https://madcletus.github.io/Riesgo-Hidrico-Villa-Angela/Zonificacion.json",
        null,
        function () {
          console.log("Zonificación cargada");
        }
      );

      // =======================
      // 3) Cargar CANALES
      // =======================
      map.data.loadGeoJson(
        "https://madcletus.github.io/Riesgo-Hidrico-Villa-Angela/Canales.json",
        null,
        function () {
          console.log("Canales cargados");
        }
      );

      // =======================
      // 4) Estilo ZONAS + CANALES
      // =======================
      map.data.setStyle(function (feature) {
        const amenaza = feature.getProperty("AMENAZA");
        const canalId = feature.getProperty("Id");

        let fillColor = "transparent";
        let strokeColor = "transparent";
        let strokeWeight = 1;
        let fillOpacity = 0.0;

        // Zonas de riesgo (AMENAZA)
        if (amenaza) {
          if (amenaza === "SEVERA") {
            fillColor = "red";
          } else if (amenaza === "ALTA") {
            fillColor = "yellow";
          } else if (amenaza === "MODERADA") {
            fillColor = "green";
          } else if (amenaza === "LEVE") {
            fillColor = "transparent";
          }
          strokeColor = fillColor === "transparent" ? "#aaaaaa" : fillColor;
          strokeWeight = 1;
          fillOpacity = fillColor === "transparent" ? 0.0 : 0.4;
        }

        // Canales (líneas rojas gruesas)
        if (canalId !== null && canalId !== undefined) {
          strokeColor = "red";
          strokeWeight = 3;
          fillOpacity = 0.0;
        }

        return {
          fillColor: fillColor,
          fillOpacity: fillOpacity,
          strokeColor: strokeColor,
          strokeWeight: strokeWeight,
        };
      });

      // =======================
      // 5) Manejar el formulario de búsqueda catastral
      // =======================
      document
        .getElementById("search-form")
        .addEventListener("submit", function (e) {
          e.preventDefault();
          const chacra = document.getElementById("chacra").value.trim();
          const fraccion = document.getElementById("fraccion").value.trim();
          const subCh = document.getElementById("sub-ch").value.trim();
          const manzana = document.getElementById("manzana").value.trim();
          const parcela = document.getElementById("parcela").value.trim();
          const quinta = document.getElementById("quinta").value.trim();

          buscarParcela({
            Chacra: chacra,
            frac: fraccion,
            Sub_Ch: subCh,
            Mza: manzana,
            Parce: parcela,
            Quinta: quinta,
          });
        });
    }

    // =======================
    // Buscar y resaltar parcela
    // =======================
    function buscarParcela(filtro) {
      let bounds = new google.maps.LatLngBounds();
      let hayMatch = false;
      let seleccionadas = [];

      catastroLayer.setStyle(function (feature) {
        // Leo los atributos del feature
        const fChacra = (feature.getProperty("Chacra") || "").toString().trim();
        const fFrac = (feature.getProperty("frac") || "").toString().trim();
        const fSubCh = (feature.getProperty("Sub_Ch") || "").toString().trim();
        const fMza = (feature.getProperty("Mza") || "").toString().trim();
        const fParce = (feature.getProperty("Parce") || "").toString().trim();
        const fQuinta = (feature.getProperty("Quinta") || "").toString().trim();

        // Coincidencia EXACTA en todos los campos no vacíos
        const coincide =
          (filtro.Chacra === "" || filtro.Chacra === fChacra) &&
          (filtro.frac === "" || filtro.frac === fFrac) &&
          (filtro.Sub_Ch === "" || filtro.Sub_Ch === fSubCh) &&
          (filtro.Mza === "" || filtro.Mza === fMza) &&
          (filtro.Parce === "" || filtro.Parce === fParce) &&
          (filtro.Quinta === "" || filtro.Quinta === fQuinta);

        if (coincide) {
          hayMatch = true;
          seleccionadas.push(feature);

          // Extiendo bounds con la geometría del feature
          const geom = feature.getGeometry();
          expandBoundsFromGeometry(geom, bounds);

          return {
            fillColor: "#00ffff",
            fillOpacity: 0.4,
            strokeColor: "#00ffff",
            strokeWeight: 3,
          };
        } else {
          // estilo base para el resto
          return {
            fillColor: "transparent",
            fillOpacity: 0,
            strokeColor: "#ffffff",
            strokeWeight: 1,
          };
        }
      });

      if (hayMatch) {
        map.fitBounds(bounds);
        // calcular porcentajes de riesgo dentro de las parcelas seleccionadas
        calcularPorcentajeRiesgo(seleccionadas);
      } else {
        document.getElementById("info-panel").innerHTML =
          "<strong>No se encontró ninguna parcela con esos datos.</strong>";
        alert("No se encontró ninguna parcela con esos datos.");
      }
    }

    // Recorre cualquier tipo de geometría y extiende los bounds
    function expandBoundsFromGeometry(geometry, bounds) {
      const type = geometry.getType();
      if (type === "Point") {
        bounds.extend(geometry.get());
      } else if (
        type === "MultiPoint" ||
        type === "LineString" ||
        type === "LinearRing"
      ) {
        geometry.getArray().forEach(function (latLng) {
          bounds.extend(latLng);
        });
      } else if (
        type === "MultiLineString" ||
        type === "Polygon" ||
        type === "MultiPolygon"
      ) {
        geometry.getArray().forEach(function (g) {
          expandBoundsFromGeometry(g, bounds);
        });
      } else if (type === "GeometryCollection") {
        geometry.getArray().forEach(function (g) {
          expandBoundsFromGeometry(g, bounds);
        });
      }
    }

    // =======================
    // Calcular porcentaje de riesgo dentro de la(s) parcela(s) seleccionada(s)
    // usando Turf.js para intersecciones y áreas
    // =======================
    function calcularPorcentajeRiesgo(featuresParcela) {
      if (!featuresParcela.length) return;

      // 1) Convertir las parcelas seleccionadas a GeoJSON
      const parcelasGeoJSON = {
        type: "FeatureCollection",
        features: [],
      };

      let pendientesParc = featuresParcela.length;

      featuresParcela.forEach((f) => {
        f.toGeoJson(function (gj) {
          parcelasGeoJSON.features.push(gj);
          pendientesParc--;
          if (pendientesParc === 0) {
            // Cuando tengo todas las parcelas como GeoJSON, paso a las zonas
            obtenerZonasYCalcular(parcelasGeoJSON);
          }
        });
      });
    }

    function obtenerZonasYCalcular(parcelasGeoJSON) {
      // 2) Obtener todas las features de map.data (zonificación + canales) como GeoJSON
      map.data.toGeoJson(function (coleccion) {
        // Filtrar solo las que tienen AMENAZA
        const zonas = coleccion.features.filter(
          (f) => f.properties && f.properties.AMENAZA
        );

        // 3) Calcular intersecciones y áreas
        const resultado = calcularAreasRiesgo(parcelasGeoJSON, zonas);

        // 4) Mostrar en el panel
        const props = parcelasGeoJSON.features[0].properties || {};
        actualizarPanelInfo(resultado, props);
      });
    }

    function calcularAreasRiesgo(parcelas, zonas) {
      let totalAreaParcelas = 0;
      const areaPorRiesgo = { SEVERA: 0, ALTA: 0, MODERADA: 0, LEVE: 0 };

      // Área total de las parcelas (suma)
      parcelas.features.forEach((p) => {
        const areaParc = turf.area(p);
        totalAreaParcelas += areaParc;

        // Para cada zona, intersectar con la parcela
        zonas.forEach((z) => {
          const inter = turf.intersect(p, z);
          if (inter) {
            const aInt = turf.area(inter);
            const riesgo = z.properties.AMENAZA;
            if (areaPorRiesgo[riesgo] !== undefined) {
              areaPorRiesgo[riesgo] += aInt;
            }
          }
        });
      });

      // Evitar división por cero
      if (totalAreaParcelas === 0) {
        return {
          totalArea: 0,
          porcentajes: { SEVERA: 0, ALTA: 0, MODERADA: 0, LEVE: 0 },
        };
      }

      const porcentajes = {};
      Object.keys(areaPorRiesgo).forEach((k) => {
        porcentajes[k] = (areaPorRiesgo[k] / totalAreaParcelas) * 100;
      });

      return {
        totalArea: totalAreaParcelas,
        areaPorRiesgo: areaPorRiesgo,
        porcentajes: porcentajes,
      };
    }

    function actualizarPanelInfo(resultado, props) {
      const nombreParcela =
        `Chacra ${props.Chacra || "-"}, ` +
        `Frac. ${props.frac || "-"}, ` +
        `Sub_Ch ${props.Sub_Ch || "-"}, ` +
        `Mza ${props.Mza || "-"}, ` +
        `Parcela ${props.Parce || "-"}, ` +
        `Quinta ${props.Quinta || "-"}`;

      const p = resultado.porcentajes;

      const html = `
        <details open>
          <summary><strong>Parcela seleccionada</strong></summary>
          <div style="margin-top:4px;">
            <div><strong>Identificación:</strong> ${nombreParcela}</div>
            <div style="margin-top:6px;"><strong>Porcentaje de riesgo dentro de la parcela:</strong></div>
            ${
              resultado.totalArea === 0
                ? "<div>No se pudo calcular el área (revisar geometrías).</div>"
                : `<ul>
                    <li>Severa: ${p.SEVERA.toFixed(1)}%</li>
                    <li>Alta: ${p.ALTA.toFixed(1)}%</li>
                    <li>Moderada: ${p.MODERADA.toFixed(1)}%</li>
                    <li>Leve: ${p.LEVE.toFixed(1)}%</li>
                  </ul>`
            }
          </div>
        </details>
      `;

      document.getElementById("info-panel").innerHTML = html;
    }
  </script>
</head>
<body onload="initMap()">
  <h1>Mapa de Riesgo Hídrico - Villa Ángela</h1>

  <div id="panel">
    <form id="search-form">
      <label>Chacra</label>
      <input type="text" id="chacra" maxlength="3" />

      <label>Frac.</label>
      <input type="text" id="fraccion" maxlength="1" />

      <label>Sub Ch.</label>
      <input type="text" id="sub-ch" maxlength="3" />

      <label>Mza</label>
      <input type="text" id="manzana" maxlength="3" />

      <label>Parcela</label>
      <input type="text" id="parcela" maxlength="6" />

      <label>Quinta</label>
      <input type="text" id="quinta" maxlength="2" />

      <button type="submit">Buscar</button>
    </form>
  </div>

  <div id="info-panel">
    <!-- Acá se muestra el “desplegable” con nombre de parcela y porcentajes -->
  </div>

  <div id="map"></div>
</body>
</html>
